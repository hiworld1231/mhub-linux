name: lint

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash -n scripts/mhub-linux

      - name: ShellCheck
        run: shellcheck --severity=warning install.sh uninstall.sh scripts/mhub-linux

      - name: Node syntax
        run: |
          node --check src/bridge.mjs
          node --check tools/sdk-trace.mjs
          node --check tools/ui-diagnose.mjs
          node --check tools/ui-fix-live.mjs
